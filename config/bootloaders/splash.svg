<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7df6"/>
      <stop offset="1" stop-color="#8cc4ff"/>
    </linearGradient>
    <g id="nuvem" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="40" ry="18"/>
      <ellipse cx="-30" cy="7" rx="27" ry="15"/>
      <ellipse cx="32" cy="7" rx="28" ry="14"/>
      <ellipse cx="7" cy="-12" rx="25" ry="17"/>
    </g>
  </defs>

  <rect width="640" height="480" fill="url(#ceu)"/>
  <use href="#nuvem" x="560" y="40"/>
  <use href="#nuvem" x="420" y="140"/>
  <use href="#nuvem" x="60" y="150"/>

  <!-- Donut -->
  <g transform="translate(90 80)">
    <circle r="56" fill="#d9a066"/>
    <circle r="51" fill="#ff5fb7"/>
    <circle r="19" fill="#5b9cf8"/>
    <circle r="22" fill="none" stroke="#d9a066" stroke-width="5"/>
    <g stroke-width="4" stroke-linecap="round">
      <line x1="-32" y1="-26" x2="-24" y2="-32" stroke="#ffd84d"/>
      <line x1="-6" y1="-42" x2="4" y2="-40" stroke="#3bb273"/>
      <line x1="24" y1="-36" x2="31" y2="-29" stroke="#fff6d7"/>
      <line x1="38" y1="-4" x2="39" y2="5" stroke="#ffd84d"/>
      <line x1="30" y1="27" x2="23" y2="34" stroke="#e84d5b"/>
      <line x1="0" y1="41" x2="-9" y2="39" stroke="#3bb273"/>
      <line x1="-32" y1="27" x2="-38" y2="18" stroke="#fff6d7"/>
      <line x1="-41" y1="-3" x2="-39" y2="6" stroke="#e84d5b"/>
    </g>
  </g>

  <text x="168" y="78" font-family="DejaVu Sans" font-weight="bold" font-size="40"
        fill="#ffd84d" stroke="#171717" stroke-width="3" paint-order="stroke">D'OH!Sec OS</text>
  <text x="170" y="104" font-family="DejaVu Sans" font-size="14" fill="#171717">2.0 Springfield - Be Safe Inc.</text>

  <!-- Faixa onde o menu e desenhado -->
  <rect x="0" y="180" width="640" height="300" fill="#5b3518" fill-opacity="0.88"/>
