source /boot/grub/config.cfg

menuentry "D'OH!Sec OS" --hotkey=d {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "D'OH!Sec OS (modo seguro)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Utilitarios...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Configuracoes do firmware UEFI" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verificar integridade da midia" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
