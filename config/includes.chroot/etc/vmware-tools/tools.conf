# VMware Tools no D'OH!Sec OS
# Os scripts padrao de energia (power off/on, suspend/resume) falham no sistema live e fazem o
# VMware recusar o desligamento. Desligados aqui (mesmo efeito de: vmware-toolbox-cmd script <x> disable).
[powerops]
poweroff-script=
poweron-script=
resume-script=
suspend-script=
